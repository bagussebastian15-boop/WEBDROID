name: Build (Debug APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Jika gagal: tampilkan error ringkas di tab Annotations / Summary (mudah dibaca di HP)
      - name: Ringkas error
        if: failure()
        run: |
          {
            echo '### Error build'
            echo '```'
            grep -E "^e: |error: |What went wrong|Execution failed|AAPT|Could not|not found|does not contain" -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error: |What went wrong" -A1 build.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ringan-browser-debug
          path: app/build/outputs/apk/debug/*.apk
